name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact reviewed version: v0.1.0-rc.N or v0.1.0'
        required: true
        type: string
      commit:
        description: 'Reviewed full commit SHA on main'
        required: true
        type: string
      materials_run_id:
        description: 'Same-repository run containing the reviewed release-materials artifact'
        required: true
        type: string
      materials_sha256:
        description: 'Reviewed materials.json SHA-256, bound to this version and commit'
        required: true
        type: string
      publish:
        description: 'Create tag, Release and GHCR images after gates (requires separate authorization)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-ghcr
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      artifact: ${{ steps.prepare.outputs.artifact }}
      materials_run: ${{ steps.prepare.outputs.materials_run }}
      materials_sha: ${{ steps.prepare.outputs.materials_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - name: Resolve approved immutable inputs
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          MATERIALS_RUN: ${{ inputs.materials_run_id }}
          MATERIALS_SHA: ${{ inputs.materials_sha256 }}
        run: |
          python3 -B scripts/release_contract.py prepare --version "$VERSION" --commit "$COMMIT" --materials-run "$MATERIALS_RUN" --materials-sha "$MATERIALS_SHA"

  test:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}

  build:
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GOTOOLCHAIN: local
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      MATERIALS_SHA: ${{ needs.prepare.outputs.materials_sha }}
      ARTIFACT_ROOT: ${{ github.workspace }}/build/release-artifact
      MATERIALS_ROOT: ${{ github.workspace }}/build/release-materials
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Check immutable input
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-materials
          run-id: ${{ needs.prepare.outputs.materials_run }}
          github-token: ${{ github.token }}
          path: ${{ env.MATERIALS_ROOT }}
      - name: Verify all corresponding source and original notices
        run: |
          python3 -B scripts/release_contract.py materials --version "$VERSION" --commit "$COMMIT" --materials "$MATERIALS_ROOT" --materials-sha "$MATERIALS_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - name: Acquire locked dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          go mod download
      - name: Build full matrix with the reviewed materials
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GOPROXY: 'off'
          GOFLAGS: -mod=readonly
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$COMMIT")"
          export SOURCE_DATE_EPOCH
          bash scripts/build.sh --version "$VERSION" --commit "$COMMIT" --output-dir "$ARTIFACT_ROOT" --license-report "$MATERIALS_ROOT/THIRD_PARTY_LICENSES.csv" --materials-dir "$MATERIALS_ROOT" --materials-sha "$MATERIALS_SHA"
          cp -R "$MATERIALS_ROOT" "$ARTIFACT_ROOT/materials"
          git diff --exit-code
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build images without pushing
        run: bash scripts/release-images.sh build "$ARTIFACT_ROOT"
      - name: Check actual image files, OS inventory and seal artifact
        run: |
          python3 -B scripts/release_contract.py seal --version "$VERSION" --commit "$COMMIT" --output "$ARTIFACT_ROOT" --materials-sha "$MATERIALS_SHA"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  publish:
    needs: [prepare, test, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      MATERIALS_SHA: ${{ needs.prepare.outputs.materials_sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      ARTIFACT_ROOT: ${{ github.workspace }}/build/release-artifact
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - name: Check immutable input
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ env.ARTIFACT_ROOT }}
      - name: Recheck complete downloaded artifact before any publication
        run: |
          python3 -B scripts/release_contract.py verify --version "$VERSION" --commit "$COMMIT" --output "$ARTIFACT_ROOT" --materials-sha "$MATERIALS_SHA"
      - uses: docker/setup-buildx-action@v4
      - name: Refuse existing tag, Release or version images
        run: python3 -B scripts/release_contract.py remote-check --version "$VERSION" --commit "$COMMIT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create tag for the approved SHA
        run: |
          git tag "$VERSION" "$COMMIT"
          git push origin "refs/tags/$VERSION"
      - name: Publish the verified image tar files to GHCR
        run: bash scripts/release-images.sh publish "$ARTIFACT_ROOT"
      - name: Create Release with the reviewed notes and exact delivery files
        run: |
          flags=(--latest=false)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); else flags=(--latest); fi
          gh release create "$VERSION" --verify-tag --target "$COMMIT" --title "$VERSION" --notes-file "$ARTIFACT_ROOT/delivery/RELEASE-NOTES.md" "${flags[@]}" "$ARTIFACT_ROOT"/delivery/*
