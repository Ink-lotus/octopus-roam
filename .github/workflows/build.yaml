name: build

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      commit:
        type: string
        default: ''
      version:
        type: string
        default: v0.0.0-ci

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      COMMIT: ${{ inputs.commit || github.sha }}
      VERSION: ${{ inputs.version || 'v0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Check immutable input
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - name: Record and check actual Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.3
      - name: Acquire locked dependencies and fixed actionlint
        run: |
          pnpm --dir web install --frozen-lockfile
          go mod download
          GOBIN="$RUNNER_TEMP/ci-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check workflows
        run: '"$RUNNER_TEMP/ci-tools/actionlint" .github/workflows/build.yaml .github/workflows/release.yaml .github/workflows/release-materials.yaml'
      - name: Test committed inputs
        run: bash scripts/ci-test.sh
      - name: Check source and lock files stayed unchanged
        run: git diff --exit-code
