name: build

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      commit:
        type: string
        default: ''
      version:
        type: string
        default: v0.0.0-ci
      force_full_test:
        description: 'Reusable workflows run the full suite by default'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      COMMIT: ${{ inputs.commit || github.sha }}
      VERSION: ${{ inputs.version || 'v0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable input
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - name: Select checks for changed files
        if: inputs.commit == '' && !inputs.force_full_test
        id: changes
        run: python3 -B scripts/ci_changes.py select
      - name: Check documentation
        if: steps.changes.outputs.docs_only == 'true'
        env:
          DOCS_BASE: ${{ steps.changes.outputs.base }}
        run: python3 -B scripts/ci_changes.py check-docs --base "$DOCS_BASE" --head "$COMMIT"
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          version: '11.15.1'
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          go-version: '1.27.3'
          cache: true
      - name: Record and check actual Go toolchain
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.3
      - name: Acquire locked dependencies and fixed actionlint
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          pnpm --dir web install --frozen-lockfile
          go mod download
          GOBIN="$RUNNER_TEMP/ci-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check workflows
        if: steps.changes.outputs.docs_only != 'true'
        run: '"$RUNNER_TEMP/ci-tools/actionlint" .github/workflows/build.yaml .github/workflows/release.yaml .github/workflows/release-materials.yaml'
      - name: Test committed inputs
        if: steps.changes.outputs.docs_only != 'true'
        run: bash scripts/ci-test.sh
      - name: Check source and lock files stayed unchanged
        run: git diff --exit-code
