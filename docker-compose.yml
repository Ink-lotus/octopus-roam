services:
  octopus-roam:
    image: "ghcr.io/ink-lotus/octopus-roam:${OCTOPUS_ROAM_VERSION:?Set OCTOPUS_ROAM_VERSION to a published Octopus Roam tag}"
    ports:
       - '8080:8080'
    volumes:      
       - '/path/to/data:/app/data'
    container_name: octopus-roam
    restart: unless-stopped
    network_mode: bridge
